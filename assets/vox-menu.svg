<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Vox Menu</title>
  <!-- A rounded tile in Roblox's top-bar black -->
  <rect width="512" height="512" rx="112" fill="#121215"/>
  <!-- The mark, on a 24-unit grid scaled 14x: a rounded V with a dot over it -->
  <g transform="translate(88 83) scale(14)">
    <path d="M5 7.5 L12 19.5 L19 7.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="5.2" r="2.1" fill="#0199ED"/>
  </g>
</svg>
